
<main class="login-page">
  <section class="login-card">
    <div class="brand-icon" aria-hidden="true">+</div>

    <p class="eyebrow">CLINIC MANAGEMENT SYSTEM</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access your workspace.</p>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <p *ngIf="errorMessage" class="error-message" role="alert">
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="security-note">
      Authorized clinic personnel only
    </p>
  </section>
</main>
